<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background styling and glow -->
    <radialGradient id="esaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fond sombre pour mise en situation -->
  <rect width="120" height="120" rx="16" fill="#0D1219" />

  <!-- Anneau extérieur principal -->
  <circle cx="60" cy="60" r="32" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-opacity="0.65" />
  
  <!-- Anneau intérieur subtil -->
  <circle cx="60" cy="60" r="28" fill="url(#esaGlow)" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />

  <!-- Trait orbital incliné à -25° -->
  <g transform="rotate(-25 60 60)">
    <line x1="20" y1="60" x2="100" y2="60" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="88" cy="60" r="2" fill="#22D3EE" />
  </g>

  <!-- Typographie ESA -->
  <text x="60" y="67" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#3B82F6" letter-spacing="-0.5">esa</text>
</svg>
